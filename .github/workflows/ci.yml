name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"

jobs:
  devcontainer:
    name: Devcontainer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build devcontainer image
        run: docker build -f .devcontainer/Dockerfile .devcontainer

  sanity:
    name: Sanity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv: [py311, py311-core219]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tox
        run: python -m pip install tox

      - name: Compile and unit test
        run: TESTPATH=tests/unit tox -e ${{ matrix.toxenv }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tox
        run: python -m pip install tox

      - name: Run linters
        run: tox -e lint,typecheck

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tox
        run: python -m pip install tox

      - name: Validate Ansible docs
        run: tox -e docs
