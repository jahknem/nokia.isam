module: isam_security_ext_authenticator
short_description: Render or parse 802.1X port authentication commands
description:
- Implements the Nokia ISAM admin security ext-authenticator command.
- This resource is render/parse only and does not execute live commands.
version_added: 1.0.0
author: Jan Kühnemund
notes:
- Source: 227_-_SecurityManagementCommands.pdf and 228_-_SecurityManagementCommands.pdf
- The documented command is operational, not persistent configuration.
options:
  config:
    type: list
    elements: dict
    suboptions:
      port:
        type: str
        required: true
      clear_statistics:
        type: bool
        default: false
  running_config:
    type: str
  state:
    type: str
    choices:
    - rendered
    - parsed
    default: rendered
