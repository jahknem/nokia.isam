module: isam_ani_onts
short_description: Resource module to configure ani ont TCA thresholds
description:
- Manages C(configure ani ont) TCA threshold entries on Nokia ISAM devices.
version_added: 1.0.0
author: Jan Khnemund
notes:
- Tested against Nokia ISAM 6.2.04ng
- This module works with connection C(network_cli)
- Implements CLI command: C(configure ani ont ())
options:
  config:
    description:
    - A list of ani ont TCA threshold configurations.
    type: list
    elements: dict
    suboptions:
      ont_idx:
        type: str
        required: true
        description:
        - The ONT interface index.
      tca_thresh:
        type: bool
        description:
        - Enable the ANI ONT TCA threshold configuration.
      lower_optical_th:
        type: str
        description:
        - Low optical threshold in dBm.
      upper_optical_th:
        type: str
        description:
        - High optical threshold in dBm.
      rssi_profile:
        type: int
        description:
        - RSSI profile identifier from 0 through 200.
  running_config:
    description:
    - This option is used only with state I(parsed).
    - The value of this option should be the output received from the device
      by executing the command C(info configure ani ont).
    type: str
  state:
    description: The state the configuration should be left in.
    type: str
    choices:
    - merged
    - replaced
    - overridden
    - deleted
    - gathered
    - rendered
    - parsed
    default: merged
