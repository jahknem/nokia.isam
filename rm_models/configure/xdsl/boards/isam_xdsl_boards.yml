module: isam_xdsl_boards
short_description: Resource module to configure xdsl board settings
description:
- Manages C(configure xdsl board) and C(configure xdsl vp-board) settings
  on Nokia ISAM devices.
version_added: 1.0.0
author: Jan Khnemund
notes:
- Tested against Nokia ISAM 6.2.04ng
- This module works with connection C(network_cli)
options:
  config:
    description: XDSL board configuration.
    type: dict
    suboptions:
      boards:
        description: List of XDSL board entries.
        type: list
        elements: dict
        suboptions:
          board_id:
            type: str
            required: true
            description:
            - Board identifier.
          admin_state:
            type: str
            choices:
            - up
            - down
            description:
            - Administrative state.
          card_type:
            type: str
            description:
            - Card type.
      vp_boards:
        description: List of XDSL VP board entries.
        type: list
        elements: dict
        suboptions:
          vp_board_id:
            type: str
            required: true
            description:
            - VP board identifier.
          admin_state:
            type: str
            choices:
            - up
            - down
            description:
            - Administrative state.
  running_config:
    description:
    - This option is used only with state I(parsed).
    - The value of this option should be the output received from the device
      by executing the command C(info configure xdsl board).
    type: str
  state:
    description: The state the configuration should be left in.
    type: str
    choices:
    - merged
    - replaced
    - overridden
    - deleted
    - gathered
    - rendered
    - parsed
    default: merged
