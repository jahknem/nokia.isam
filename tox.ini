[tox]
envlist = py310, py311, py312, lint, typecheck
skipsdist = true

[testenv]
description = Run unit tests
setenv =
    PYTHONPATH = {env:COLLECTIONS_PATH:/tmp/opencode}
    ANSIBLE_COLLECTIONS_PATH = {env:COLLECTIONS_PATH:/tmp/opencode}
deps =
    pytest
    pytest-cov
    anytree
commands =
    python -m compileall plugins/module_utils plugins/modules tests/unit/modules
    python -m pytest tests/unit/modules/network/isam -v --cov=plugins/module_utils --cov-report=term {posargs}

[testenv:lint]
description = Run linting checks
deps =
    flake8
    ansible-lint
commands =
    flake8 plugins/ tests/
    ansible-lint plugins/modules/

[testenv:typecheck]
description = Run type checking
deps =
    mypy
commands =
    mypy plugins/module_utils/ plugins/modules/ --ignore-missing-imports --check-untyped-defs

[testenv:docs]
description = Verify ansible-doc for all modules
deps =
    ansible-core
commands =
    ansible-doc -t module nokia.isam.isam_interfaces
    ansible-doc -t module nokia.isam.isam_bridges
    ansible-doc -t module nokia.isam.isam_ethernet_line
    ansible-doc -t module nokia.isam.isam_vlans
    ansible-doc -t module nokia.isam.isam_facts
    ansible-doc -t module nokia.isam.isam_pon_interfaces
    ansible-doc -t module nokia.isam.isam_ethernet_onts
    ansible-doc -t module nokia.isam.isam_equipment_onts
    ansible-doc -t module nokia.isam.isam_qos_interfaces
    ansible-doc -t module nokia.isam.isam_qos_profiles
    ansible-doc -t module nokia.isam.isam_xdsl_lines
    ansible-doc -t module nokia.isam.isam_xdsl_profiles
    ansible-doc -t module nokia.isam.isam_link_agg
    ansible-doc -t module nokia.isam.isam_xstp
    ansible-doc -t module nokia.isam.isam_equipment
