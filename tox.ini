[tox]
envlist = py310, py311, py312, lint, typecheck, docs
skipsdist = true

[testenv]
description = Run unit tests
setenv =
    COLLECTIONS_PATH = {toxworkdir}/collections
    PYTHONPATH = {toxworkdir}/collections
    ANSIBLE_COLLECTIONS_PATH = {toxworkdir}/collections
deps =
     ansible-core>=2.15
     pytest
    pytest-cov
    anytree
commands =
    python -c "import os; p=os.path.join(r'{env:COLLECTIONS_PATH}', 'ansible_collections', 'nokia'); os.makedirs(p, exist_ok=True); l=os.path.join(p, 'isam'); os.path.islink(l) or os.symlink(r'{toxinidir}', l)"
    ansible-galaxy collection install -r {toxinidir}/requirements.yml -p {env:COLLECTIONS_PATH}
    ansible --version
    python -m compileall plugins/module_utils plugins/modules tests/unit/modules
    python -m pytest tests/unit/modules/network/isam -v --cov=plugins/module_utils --cov-report=term {posargs}

[testenv:lint]
description = Run linting checks
deps =
    flake8
    ansible-lint
commands =
    flake8 plugins/ tests/ --max-line-length=160 --ignore=E122,E124,E126,E127,E128,E203,E225,E231,E265,E301,E302,E303,E305,E402,E501,E701,E702,E704,E741,F401,F403,F405,F811,F841,W291,W292,W293,W391,W503,W504
    ansible-lint plugins/modules/

[testenv:typecheck]
description = Run type checking
deps =
    mypy
commands =
    mypy plugins/module_utils/ plugins/modules/ --ignore-missing-imports --check-untyped-defs --disable-error-code=var-annotated --disable-error-code=assignment --disable-error-code=has-type --disable-error-code=index --disable-error-code=call-arg --disable-error-code=attr-defined

[testenv:docs]
description = Verify ansible-doc for all modules
deps =
     ansible-core
commands =
     python -c "import os; p=os.path.join(r'{env:COLLECTIONS_PATH}', 'ansible_collections', 'nokia'); os.makedirs(p, exist_ok=True); l=os.path.join(p, 'isam'); os.path.islink(l) or os.symlink(r'{toxinidir}', l)"
     ansible-galaxy collection install -r {toxinidir}/requirements.yml -p {env:COLLECTIONS_PATH}
     python -c "import glob, subprocess; modules=[p.rsplit('/', 1)[-1][:-3] for p in glob.glob('plugins/modules/*.py') if not p.endswith('__init__.py')]; raise SystemExit(max(subprocess.run(['ansible-doc', '-t', 'module', 'nokia.isam.' + m]).returncode for m in modules))"
