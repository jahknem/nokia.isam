---
- name: Gather configuration without logging values
  action:
    module: "{{ resource_module }}"
    state: gathered
  register: gathered_resource
  no_log: true

- name: Compare merged configuration without sending it
  action:
    module: "{{ resource_module }}"
    state: merged
    config: "{{ gathered_resource.gathered }}"
  check_mode: true
  register: merged_resource
  no_log: true
  when: gathered_resource.gathered.values() | select | list | length > 0

- name: Compare replaced configuration without sending it
  action:
    module: "{{ resource_module }}"
    state: replaced
    config: "{{ gathered_resource.gathered }}"
  check_mode: true
  register: replaced_resource
  no_log: true
  when: gathered_resource.gathered.values() | select | list | length > 0

- name: Report command counts only
  ansible.builtin.debug:
    msg: >-
      {{ resource_module }} gathered successfully;
      merged={{ merged_resource.commands | default([]) | length }}
      replaced={{ replaced_resource.commands | default([]) | length }};
      empty={{ gathered_resource.gathered.values() | select | list | length == 0 }}

- name: Assert no unexpected reconciliation commands
  ansible.builtin.assert:
    that:
      - >-
        merged_resource.commands | default([]) | length == 0
      - >-
        replaced_resource.commands | default([]) | length == 0
    quiet: true
  # No exception for masked-security commands: placeholders must never be sent.
  no_log: true
