# Every module runs through the nokia.isam.isam action plugin (plugins/action/isam.py),
# like the platform action plugins of other network collections. The plugin checks the
# connection type, propagates check mode for direct execution and runs offline action
# states (merged/replaced/overridden/deleted with running_config) without opening the
# device connection. Modules that never take that offline path (isam_facts, cli_config,
# the action modules, IHUB and isam_topology_discovery) are routed too: for them the
# plugin only adds the connection check and netcommon direct execution (IHUB modules,
# whose files do not import AnsibleModule, fall back to normal execution).
plugin_routing:
  action:
    cli_config:
      redirect: nokia.isam.isam
    isam_alarm:
      redirect: nokia.isam.isam
    isam_ani_onts:
